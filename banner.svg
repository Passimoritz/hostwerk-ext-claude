<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34201d"/><stop offset=".62" stop-color="#804838"/><stop offset="1" stop-color="#d97757"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#e39981" stop-opacity=".55"/><stop offset="1" stop-color="#e39981" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".09"/></pattern>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="bbm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eab4a3"/><stop offset="1" stop-color="#8d4d39"/></linearGradient><linearGradient id="bbv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab4a3"/><stop offset="1" stop-color="#d97757"/></linearGradient><linearGradient id="bbw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ee"/></linearGradient><linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2a62b"/></linearGradient><radialGradient id="bbh" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="bbs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>.b1,.b2,.f,.s,.k{transform-box:fill-box;transform-origin:50% 50%}
@keyframes b1{to{transform:translate(-90px,40px) scale(1.15)}}@keyframes b2{to{transform:translate(70px,-30px) scale(.9)}}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes s{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
@keyframes k{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.b1{animation:b1 16s ease-in-out infinite alternate}.b2{animation:b2 19s ease-in-out infinite alternate}
.f{animation:f 9s ease-in-out infinite}.f1{animation-duration:11s;animation-delay:-3s}.f2{animation-duration:13s;animation-delay:-6s}
.s{animation:s 3.4s ease-in-out infinite}.k{animation:k 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.b1,.b2,.f,.s,.k{animation:none!important}}.bbfl,.bbpu,.bbbl,.bbsp,.bbwg,.bbri,.bbsd,.bbpop{transform-box:fill-box;transform-origin:50% 50%}.bbgr{transform-box:fill-box;transform-origin:50% 100%}@keyframes bbfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}.bbfl{animation:bbfl 4.2s ease-in-out infinite}@keyframes bbsd{0%,100%{transform:scaleX(1);opacity:.32}50%{transform:scaleX(.85);opacity:.2}}.bbsd{animation:bbsd 4.2s ease-in-out infinite}@keyframes bbpu{0%,100%{opacity:.55}50%{opacity:1}}.bbpu{animation:bbpu 2.4s ease-in-out infinite}@keyframes bbbl{0%,44%,56%,100%{opacity:1}50%{opacity:.15}}.bbbl{animation:bbbl 3s steps(1,end) infinite}@keyframes bbsp{to{transform:rotate(360deg)}}.bbsp{animation:bbsp 14s linear infinite}@keyframes bbwg{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}.bbwg{animation:bbwg 3.4s ease-in-out infinite}@keyframes bbri{0%{transform:translateY(2px);opacity:.7}100%{transform:translateY(-3.5px);opacity:1}}.bbri{animation:bbri 1.6s ease-in-out infinite alternate}@keyframes bbgr{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}.bbgr{animation:bbgr 2.8s ease-in-out infinite}@keyframes bbpop{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}.bbpop{animation:bbpop 2.6s ease-in-out infinite}@keyframes bbsh{0%,60%{transform:translateX(-30px)}100%{transform:translateX(70px)}}.bbsh{animation:bbsh 5s ease-in-out infinite}@keyframes bbdash{to{stroke-dashoffset:-40}}.bbdash{animation:bbdash 2.4s linear infinite}@keyframes bbsw{0%,100%{transform:rotate(-50deg)}50%{transform:rotate(35deg)}}</style>
<rect width="1280" height="400" fill="url(#bg)"/>
<circle class="b1" cx="1020" cy="80" r="300" fill="url(#o1)"/>
<circle class="b2" cx="260" cy="380" r="260" fill="url(#o2)"/>
<rect width="1280" height="400" fill="url(#dots)"/>
<rect width="1280" height="400" fill="url(#fade)"/>
<g transform="translate(150 92) rotate(-8) scale(2.2)"><g class="f f0" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g></g>
<g transform="translate(380 268) rotate(6) scale(1.8)"><g class="f f1" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></g></g>
<g transform="translate(640 70) rotate(-4) scale(1.5)"><g class="f f2" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></g></g>
<g class="k">
<rect x="882" y="92" width="216" height="216" rx="54" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
<g transform="translate(898 104) scale(2.85)"><ellipse class="bbsd" cx="32" cy="55" rx="12" ry="2.8" fill="#000" opacity=".32"/><g class="bbfl"><g class="bbsp"><path d="M32 8c2 10 4 13 14 16-10 3-12 6-14 16-2-10-4-13-14-16 10-3 12-6 14-16z" fill="url(#bbm)" transform="translate(0 4)"/></g><path d="M32 12c2 10 4 13 14 16-10 3-12 6-14 16-2-10-4-13-14-16 10-3 12-6 14-16z" fill="url(#bbh)"/></g><g fill="#fff"><path class="bbpop" d="M48 40l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z"/><path class="bbpop" style="animation-delay:1s" d="M15 13l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z"/></g></g>
</g>
<g transform="translate(1040 74) scale(0.9)"><path class="s" style="animation-delay:0s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(1170 300) scale(0.6)"><path class="s" style="animation-delay:1.1s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(860 320) scale(0.5)"><path class="s" style="animation-delay:2.2s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(560 150) scale(0.45)"><path class="s" style="animation-delay:0.6s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g>
</svg>
