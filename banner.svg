<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34201d"/><stop offset=".62" stop-color="#804838"/><stop offset="1" stop-color="#d97757"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#e39981" stop-opacity=".55"/><stop offset="1" stop-color="#e39981" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".09"/></pattern>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="bbt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9b09e"/><stop offset="1" stop-color="#dc8264"/></linearGradient><linearGradient id="bbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf694d"/><stop offset="1" stop-color="#874a36"/></linearGradient><linearGradient id="bbsh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="bbc"><path d="M32 10 L54 21 L32 32 L10 21 Z"/></clipPath>
</defs>
<style>.b1,.b2,.f,.s,.k{transform-box:fill-box;transform-origin:50% 50%}
@keyframes b1{to{transform:translate(-90px,40px) scale(1.15)}}@keyframes b2{to{transform:translate(70px,-30px) scale(.9)}}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes s{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
@keyframes k{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.b1{animation:b1 16s ease-in-out infinite alternate}.b2{animation:b2 19s ease-in-out infinite alternate}
.f{animation:f 9s ease-in-out infinite}.f1{animation-duration:11s;animation-delay:-3s}.f2{animation-duration:13s;animation-delay:-6s}
.s{animation:s 3.4s ease-in-out infinite}.k{animation:k 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.b1,.b2,.f,.s,.k{animation:none!important}}.bbbob,.bbshadow{transform-box:fill-box;transform-origin:50% 50%}@keyframes bbb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}@keyframes bbsd{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.86);opacity:.22}}@keyframes bbs{0%,55%{transform:translateX(0)}100%{transform:translateX(78px)}}@keyframes bbg{0%,100%{opacity:.9}50%{opacity:1}}.bbbob{animation:bbb 4.2s ease-in-out infinite}.bbshadow{animation:bbsd 4.2s ease-in-out infinite}.bbshine{animation:bbs 5.5s ease-in-out infinite}.bbglow{animation:bbg 4.2s ease-in-out infinite}</style>
<rect width="1280" height="400" fill="url(#bg)"/>
<circle class="b1" cx="1020" cy="80" r="300" fill="url(#o1)"/>
<circle class="b2" cx="260" cy="380" r="260" fill="url(#o2)"/>
<rect width="1280" height="400" fill="url(#dots)"/>
<rect width="1280" height="400" fill="url(#fade)"/>
